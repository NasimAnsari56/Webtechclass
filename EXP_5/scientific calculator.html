<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <a href="scientific calculator.html">scientific calculator</a> |
<a href="simple calculator.html">simple calculator</a> |

    <style>
        body{
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: lightcyan;
        }
        .calc{
            background-color: brown;
            width: 320px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }
        input{
            width: 90%;
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            background-color: skyblue;
            border-radius: 5px;
            border: none;
        }
        button{
            padding: 10px;
            margin: 5px;
            width: 60px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover{
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>

<h1>Scientific Calculator</h1>

<div class="calc">
    <input type="text" id="display" readonly>

    <br>

    <!-- Numbers -->
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')">÷</button><br>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')">×</button><br>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')">−</button><br>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="calculate()">=</button>
    <button onclick="append('+')">+</button><br>

    
    <button onclick="sin()">sin</button>
    <button onclick="cos()">cos</button>
    <button onclick="tan()">tan</button>
    <button onclick="sqrt()">√</button><br>

    <button onclick="square()">x²</button>
    <button onclick="log()">log</button>
    <button onclick="clearDisplay()">C</button>
</div>

<script>
    function append(value){
        document.getElementById("display").value += value;
    }

    function calculate(){
        try{
            document.getElementById("display").value =
                eval(document.getElementById("display").value);
        }catch{
            document.getElementById("display").value = "Error";
        }
    }

    function clearDisplay(){
        document.getElementById("display").value = "";
    }

    function sin(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = Math.sin(x);
    }

    function cos(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = Math.cos(x);
    }

    function tan(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = Math.tan(x);
    }

    function sqrt(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = Math.sqrt(x);
    }

    function square(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = x * x;
    }

    function log(){
        let x = document.getElementById("display").value;
        document.getElementById("display").value = Math.log10(x);
    }
</script>

</body>
</html>
